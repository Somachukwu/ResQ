<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none" aria-label="ResQ Logo">
  <!-- Symbol -->
  <g transform="translate(2, 2)">
    <!-- Outer Q-ring -->
    <circle cx="21" cy="21" r="15" stroke="#0D6E6E" stroke-width="3" stroke-linecap="round" stroke-dasharray="82 14" stroke-dashoffset="6" />
    <!-- EKG Vital Pulse Line -->
    <path d="M 3 21 H 13.5 L 16 24.5 L 20 7 L 24 33 L 27.5 14 L 30 21 H 45" stroke="#0D6E6E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Q-Tail / GPS Reticle -->
    <circle cx="34" cy="34" r="7.5" stroke="#F0920A" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.65" />
    <line x1="24" y1="34" x2="44" y2="34" stroke="#F0920A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="34" y1="24" x2="34" y2="44" stroke="#F0920A" stroke-width="1.5" stroke-linecap="round" />
    <!-- Amber Pulse Core -->
    <circle cx="34" cy="34" r="3.5" fill="#F0920A" />
  </g>
  
  <!-- Wordmark -->
  <text x="58" y="29" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="500" fill="currentColor" letter-spacing="-0.03em">
    Res<tspan fill="#0D6E6E">Q</tspan>
  </text>
  <text x="59" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#9C9A92" letter-spacing="0.16em">
    EMERGENCY INTELLIGENCE
  </text>
</svg>

