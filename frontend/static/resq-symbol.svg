<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-label="ResQ Symbol">
  <!-- Outer Q-ring with bottom-right aperture for coordinate reticle -->
  <circle cx="21" cy="21" r="15" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="82 14" stroke-dashoffset="6" />
  
  <!-- EKG Vital Pulse Line -->
  <path d="M 3 21 H 13.5 L 16 24.5 L 20 7 L 24 33 L 27.5 14 L 30 21 H 45" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Q-Tail / GPS Coordinate Reticle -->
  <circle cx="34" cy="34" r="7.5" stroke="#F0920A" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.65" />
  <line x1="24" y1="34" x2="44" y2="34" stroke="#F0920A" stroke-width="1.5" stroke-linecap="round" />
  <line x1="34" y1="24" x2="34" y2="44" stroke="#F0920A" stroke-width="1.5" stroke-linecap="round" />
  <line x1="28" y1="32" x2="28" y2="36" stroke="#F0920A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="40" y1="32" x2="40" y2="36" stroke="#F0920A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="28" x2="36" y2="28" stroke="#F0920A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="40" x2="36" y2="40" stroke="#F0920A" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- Amber Coordinate Center Pulse -->
  <circle cx="34" cy="34" r="3.5" fill="#F0920A" />
</svg>

