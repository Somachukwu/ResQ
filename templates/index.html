<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQ — Routing Test</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0F1117; color: #F7F5F0; }
    #header { padding: 16px 24px; border-bottom: 1px solid #2C2C2A; }
    #header h1 { font-size: 18px; font-weight: 500; color: #0D6E6E; }
    #header p { font-size: 13px; color: #9C9A92; margin-top: 2px; }
    #container { display: flex; height: calc(100vh - 57px); }
    #map { flex: 1; }
    #panel {
      width: 320px; background: #1A1A1A; border-left: 1px solid #2C2C2A;
      padding: 20px; overflow-y: auto;
    }
    #panel h2 { font-size: 14px; font-weight: 500; margin-bottom: 16px; color: #F7F5F0; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 11px; color: #9C9A92; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field select {
      width: 100%; padding: 8px 10px; background: #0F1117;
      border: 1px solid #2C2C2A; border-radius: 6px;
      color: #F7F5F0; font-size: 13px;
    }
    button {
      width: 100%; padding: 10px; background: #0D6E6E;
      border: none; border-radius: 6px; color: #F7F5F0;
      font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 4px;
    }
    button:hover { background: #0a5a5a; }
    #result {
      margin-top: 20px; padding: 14px; background: #0F1117;
      border: 1px solid #2C2C2A; border-radius: 8px; display: none;
    }
    #result h3 { font-size: 13px; font-weight: 500; color: #0D6E6E; margin-bottom: 10px; }
    .stat { margin-bottom: 8px; }
    .stat .label { font-size: 11px; color: #9C9A92; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat .value { font-size: 16px; font-weight: 500; color: #F7F5F0; margin-top: 2px; }
    .stat .value.urgent { color: #F0920A; }
    #tip { font-size: 12px; color: #9C9A92; margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>

<div id="header">
  <h1>ResQ</h1>
  <p>Routing test — click the map to set an incident location</p>
</div>

<div id="container">
  <div id="map"></div>
  <div id="panel">
    <h2>Find nearest hospital</h2>

    <div class="field">
      <label>Incident latitude</label>
      <input type="number" id="lat" placeholder="e.g. 6.4541" step="any"/>
    </div>
    <div class="field">
      <label>Incident longitude</label>
      <input type="number" id="lng" placeholder="e.g. 7.5248" step="any"/>
    </div>
    <div class="field">
      <label>Incident type</label>
      <select id="incident_type">
        <option value="general">General</option>
        <option value="trauma">Trauma / Road accident</option>
      </select>
    </div>

    <button onclick="findHospital()">Find nearest hospital</button>

    <div id="result">
      <h3 id="hospital-name"></h3>
      <div class="stat">
        <div class="label">Travel time</div>
        <div class="value urgent" id="duration"></div>
      </div>
      <div class="stat">
        <div class="label">Distance</div>
        <div class="value" id="distance"></div>
      </div>
      <div class="stat">
        <div class="label">Capability</div>
        <div class="value" id="capability"></div>
      </div>
    </div>

    <p id="tip">Click anywhere on the map to set the incident location, then press the button above.</p>
  </div>
</div>

<script>
  const map = L.map("map").setView([6.4541, 7.5248], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  const hospitals = [
    { name: "ESUTH", lat: 6.4541, lng: 7.5248 },
    { name: "NOH Enugu", lat: 6.4418, lng: 7.4985 },
    { name: "UNTH", lat: 6.4698, lng: 7.5597 },
    { name: "Park Lane", lat: 6.4622, lng: 7.5106 }
  ];

  const hospitalIcon = L.divIcon({
    html: '<div style="width:12px;height:12px;background:#0D6E6E;border-radius:50%;border:2px solid #F7F5F0;"></div>',
    iconSize: [12, 12], iconAnchor: [6, 6]
  });

  hospitals.forEach(h => {
    L.marker([h.lat, h.lng], { icon: hospitalIcon })
      .addTo(map)
      .bindPopup(`<b>${h.name}</b><br>Hospital`);
  });

  let incidentMarker = null;
  let routeLayer = null;

  const incidentIcon = L.divIcon({
    html: '<div style="width:16px;height:16px;background:#F0920A;border-radius:50%;border:2px solid #F7F5F0;"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8]
  });

  map.on("click", function(e) {
    const { lat, lng } = e.latlng;
    document.getElementById("lat").value = lat.toFixed(6);
    document.getElementById("lng").value = lng.toFixed(6);

    if (incidentMarker) map.removeLayer(incidentMarker);
    incidentMarker = L.marker([lat, lng], { icon: incidentIcon })
      .addTo(map)
      .bindPopup("Incident location")
      .openPopup();
  });

  async function findHospital() {
    const lat = parseFloat(document.getElementById("lat").value);
    const lng = parseFloat(document.getElementById("lng").value);
    const incident_type = document.getElementById("incident_type").value;

    if (!lat || !lng) {
      alert("Click the map to set an incident location first.");
      return;
    }

    const btn = document.querySelector("button");
    btn.textContent = "Calculating...";
    btn.disabled = true;

    try {
      const response = await fetch("/api/nearest-hospital", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lat, lng, incident_type })
      });

      const data = await response.json();

      if (data.error) {
        alert("Error: " + data.error);
        return;
      }

      document.getElementById("hospital-name").textContent = data.recommended_hospital;
      document.getElementById("duration").textContent = data.duration_mins + " mins";
      document.getElementById("distance").textContent = data.distance_km + " km";
      document.getElementById("capability").textContent = data.capability;
      document.getElementById("result").style.display = "block";

      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.geoJSON(data.geometry, {
        style: { color: "#0D6E6E", weight: 4, opacity: 0.8 }
      }).addTo(map);

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

    } catch (err) {
      alert("Request failed. Check your API key and try again.");
      console.error(err);
    } finally {
      btn.textContent = "Find nearest hospital";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
